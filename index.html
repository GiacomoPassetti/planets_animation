<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravitational Orbit Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Setup Panel -->
  <div id="setup-panel">
    <h1>🪐 Orbit Simulator</h1>
    <div class="control-row">
      <label for="planet-count">Number of planets:</label>
      <input type="number" id="planet-count" min="2" max="10" value="3">
      <button id="btn-generate-fields">Set</button>
    </div>
    <div id="planet-fields"></div>
    <button id="btn-start" class="primary">Launch Simulation</button>
  </div>

  <!-- Simulation View -->
  <div id="simulation-view" class="hidden">
    <canvas id="canvas"></canvas>
    <div id="sim-controls">
      <button id="btn-stop">⏸ Stop</button>
      <button id="btn-resume" class="hidden">▶ Resume</button>
      <button id="btn-reset">↺ Reset</button>
    </div>
  </div>

  <script src="simulation.js"></script>
  <script src="renderer.js"></script>
  <script src="app.js"></script>
</body>
</html>
